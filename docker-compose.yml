services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: faultdb
      POSTGRES_USER: fault_admin
      POSTGRES_PASSWORD: fault_admin
    ports:
      - "5432:5432"
    volumes:
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault_admin -d faultdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://fault_ro:fault_ro@db:5432/faultdb
      POOL_SIZE: "2"
      # How long to wait for PQcancel acknowledgement before the backend is
      # considered still busy and discarded.  Keep below any upstream proxy
      # response timeout.
      CANCEL_GRACE_S: "3.0"
      # Time allowed for in-flight cancellation cleanups during shutdown.
      SHUTDOWN_DRAIN_S: "5.0"
    ports:
      - "8000:8000"

volumes:
  pgdata:
